<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kitclub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="picker.js?v=d2687d7a"></script>
<style>
:root { color-scheme: light dark; }
body { margin: 0; padding: 16px; font: 16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif;
  background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
.l { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--tg-theme-hint-color, #888); margin: 18px 0 8px; }
#t { display: flex; flex-wrap: wrap; gap: 8px; }
#t button { flex: 1 1 28%; min-height: 48px; border-radius: 12px; border: 1px solid var(--tg-theme-hint-color, #ccc);
  background: transparent; color: inherit; font: inherit; }
#t button.on { background: var(--tg-theme-button-color, #2481cc); border-color: transparent;
  color: var(--tg-theme-button-text-color, #fff); font-weight: 600; }

/* Барабаны «как на iPhone»: две колонки, листаются вверх-вниз и защёлкиваются на значении */
.wheels { position: relative; isolation: isolate; display: flex; justify-content: center; align-items: center;
  gap: 6px; height: 200px; margin: 4px 0; user-select: none; -webkit-user-select: none; }
.band { position: absolute; z-index: -1; left: 50%; top: 80px; width: 200px; height: 40px; margin-left: -100px;
  border-radius: 10px; background: var(--tg-theme-secondary-bg-color, #eee); }
.wheel { height: 200px; width: 84px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; cursor: grab; touch-action: pan-y;
  -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel .pad { height: 80px; }
.wheel .it { height: 40px; line-height: 40px; text-align: center; font-size: 28px; font-variant-numeric: tabular-nums;
  scroll-snap-align: center; color: var(--tg-theme-hint-color, #999); }
.wheel .it.sel { color: var(--tg-theme-text-color, #111); font-weight: 600; }
.wheel .it.off { opacity: .25; }
.colon { font-size: 28px; font-weight: 600; }

#win { text-align: center; color: var(--tg-theme-hint-color, #888); font-size: 14px; margin-top: 10px; min-height: 20px; }
#err { color: var(--tg-theme-destructive-text-color, #d33); text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="l" id="lt"></div>
<div id="t"></div>
<div class="l" id="lw"></div>
<div class="wheels">
  <div class="band"></div>
  <div class="wheel" id="wh"></div>
  <div class="colon">:</div>
  <div class="wheel" id="wm"></div>
</div>
<div id="win"></div>
<div id="err"></div>
<script>
var LABELS = /*L*/{"ru":{"table":"Стол","time":"Время","now":"сейчас","get":"Ролик {start} – {end}","pick":"Сначала выбери стол","send":"Выбери стол","error":"Ссылка устарела — нажми /start в боте"},"en":{"table":"Table","time":"Time","now":"now","get":"Clip {start} – {end}","pick":"Pick a table first","send":"Pick a table","error":"This link is outdated — tap /start in the bot"},"ka":{"table":"მაგიდა","time":"დრო","now":"ახლა","get":"ვიდეო {start} – {end}","pick":"ჯერ აირჩიე მაგიდა","send":"აირჩიე მაგიდა","error":"ბმული მოძველებულია — დააჭირე /start-ს ბოტში"}}/*L*/;
(function () {
  var TG = window.Telegram && window.Telegram.WebApp, P = window.Picker, M = 60000, ITEM = 40;
  var q = new URLSearchParams(location.search);
  var L = LABELS[q.get("l")] || LABELS.en;
  function $(id) { return document.getElementById(id); }
  var cfg;
  try { cfg = P.decodeCfg(q.get("c") || ""); } catch (e) { $("err").textContent = L.error; return; }

  var sel = null, wh = $("wh"), wm = $("wm"), slots = [], hourI = 0, minI = 0, atNow = true, timer = null;

  function now() { return Math.floor(Date.now() / M) * M; }
  function begin() { return P.clubBegin(Date.now(), cfg.ds, cfg.o); }
  function picked() { return P.clamp(slots[hourI] + minI * M, begin(), now()); }
  function minuteOf(ms) { return Number(P.hhmm(ms, cfg.o).slice(2)); }

  function fill(el, labels) {
    var html = '<div class="pad"></div>';
    for (var i = 0; i < labels.length; i++) html += '<div class="it">' + labels[i] + "</div>";
    el.innerHTML = html + '<div class="pad"></div>';
  }
  function items(el) { return el.querySelectorAll(".it"); }
  function scrollToIndex(el, i, smooth) {
    if (el.scrollTo) el.scrollTo({ top: i * ITEM, behavior: smooth ? "smooth" : "auto" });
    else el.scrollTop = i * ITEM;
  }

  function buildHours() {
    slots = P.hourSlots(begin(), now(), cfg.o);
    fill(wh, slots.map(function (ms) { return P.hhmm(ms, cfg.o).slice(0, 2); }));
  }

  function mark() {
    var hs = items(wh), ms = items(wm), lo = begin(), hi = now();
    for (var i = 0; i < hs.length; i++) hs[i].className = "it" + (i === hourI ? " sel" : "");
    for (var j = 0; j < ms.length; j++) {
      var t = slots[hourI] + j * M;
      ms[j].className = "it" + (j === minI ? " sel" : "") + (t < lo || t > hi ? " off" : "");
    }
  }

  function draw() {
    var t = picked(), half = cfg.h * 1000;
    var text = L.get.replace("{start}", P.hms(t - half, cfg.o)).replace("{end}", P.hms(t + half, cfg.o));
    $("win").textContent = sel === null ? L.pick : text;
    if (TG) { TG.MainButton.setText(sel === null ? L.send : text); TG.MainButton.show(); }
    mark();
  }

  /* Поставить барабаны на момент ms (уже внутри рабочего дня). */
  function setTo(ms, smooth) {
    var hourStart = ms - minuteOf(ms) * M;
    hourI = Math.max(0, slots.indexOf(hourStart));
    minI = minuteOf(ms);
    scrollToIndex(wh, hourI, smooth);
    scrollToIndex(wm, minI, smooth);
    draw();
  }

  /* Колесо остановилось: читаем значения, недопустимое время возвращаем в рабочий день. */
  function settle() {
    var h = Math.min(slots.length - 1, Math.max(0, Math.round(wh.scrollTop / ITEM)));
    var m = Math.min(59, Math.max(0, Math.round(wm.scrollTop / ITEM)));
    var changed = h !== hourI || m !== minI;
    hourI = h; minI = m;
    var raw = slots[hourI] + minI * M, ok = P.clamp(raw, begin(), now());
    if (ok !== raw) setTo(ok, true); else draw();
    atNow = picked() >= now();
    if (changed && TG) TG.HapticFeedback.selectionChanged();
  }
  function onScroll() { clearTimeout(timer); timer = setTimeout(settle, 120); }

  /* На компьютере колонку тянут мышью: браузер сам так не листает, поэтому двигаем scrollTop вручную.
     Тач-скролл на телефоне не трогаем — он нативный. Клик по значению (без перетаскивания) выбирает его. */
  function attachDrag(el) {
    var startY = 0, startTop = 0, dragging = false, moved = false;
    el.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "touch") return;
      dragging = true; moved = false; startY = e.clientY; startTop = el.scrollTop;
      el.style.scrollSnapType = "none";
      if (el.setPointerCapture) el.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var dy = e.clientY - startY;
      if (Math.abs(dy) > 3) moved = true;
      el.scrollTop = startTop - dy;
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      el.style.scrollSnapType = "";
      scrollToIndex(el, Math.round(el.scrollTop / ITEM), true);
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    /* Значение под точкой клика считаем по координате: при захвате указателя событие приходит от колонки,
       а не от цифры. Сверху колонки отступ 80px (.pad), строка — ITEM. */
    el.addEventListener("click", function (e) {
      if (moved) { moved = false; return; }
      var y = e.clientY - el.getBoundingClientRect().top + el.scrollTop - 80;
      var i = Math.floor(y / ITEM), n = items(el).length;
      if (i >= 0 && i < n) scrollToIndex(el, i, true);
    });
  }

  function refresh() {
    var keep = atNow ? now() : picked();
    buildHours();
    setTo(P.clamp(keep, begin(), now()), false);
  }

  $("lt").textContent = L.table;
  $("lw").textContent = L.time;
  cfg.t.forEach(function (tb) {
    var b = document.createElement("button");
    b.textContent = tb[1];
    b.onclick = function () {
      sel = tb[0];
      var all = $("t").children;
      for (var i = 0; i < all.length; i++) all[i].className = all[i] === b ? "on" : "";
      if (TG) TG.HapticFeedback.selectionChanged();
      draw();
    };
    $("t").appendChild(b);
  });

  var mins = [];
  for (var i = 0; i < 60; i++) mins.push((i < 10 ? "0" : "") + i);
  fill(wm, mins);
  wh.addEventListener("scroll", onScroll);
  wm.addEventListener("scroll", onScroll);
  attachDrag(wh);
  attachDrag(wm);

  if (TG) {
    TG.ready();
    TG.expand();
    TG.MainButton.onClick(function () {
      if (sel === null) { TG.HapticFeedback.notificationOccurred("warning"); return; }
      TG.sendData("c:" + sel + ":" + P.hhmm(picked(), cfg.o));
    });
  }
  if (cfg.t.length === 1) $("t").firstChild.onclick();
  refresh();
  setInterval(function () { if (atNow) refresh(); }, 20000);
})();
</script>
</body>
</html>
